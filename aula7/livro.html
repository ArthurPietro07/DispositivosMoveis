<script>
    let continuar;
    let livros = [];

    do{
        let livro = prompt("Digite o nome do livro que você leu:");

        if (livro == null || livro.trim() === "") {
            alert("O nome do livro não pode estar vazio!");
        continue;
        }

        livros.push(livro);

        continuar = prompt("Deseja adicionar outro livro? (s/n)")?.toLowerCase();}while (continuar === "s");

        alert(`Você cadastrou ${livros.length} livro(s):\n\n${livros.join("\n")}`);
        
</script>
