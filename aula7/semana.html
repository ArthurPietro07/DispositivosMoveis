<script>
    let dia = prompt("Digite um dia da semana").toLowerCase(); 
    switch (dia) {
        case "segunda":
        case "terça":
        case "quarta":
        case "quinta":
            alert("Hora de estudar");
            break;
        case "sexta":
            alert("Bora jogar FIFA");
            break;
        case "sábado":
            alert("Sessão de terros com Resident Evil");
            break;
        case "domingo":
            alert("Netflix e relax!");
            break;
        default:
            alert("Você digitou algo errado");
    }
</script>
