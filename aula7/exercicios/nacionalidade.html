<script>
    let nacionalidade = (window.prompt("Escreva seu país:").toLocaleLowerCase());
    if (nacionalidade == "brasil") {
        document.write("Você é brasileiro");
    } else if (nacionalidade == "rússia") {
        document.write("Você é russo");
    } else if (nacionalidade == "espanha") {
        document.write("Você é espanhol");
    } else if (nacionalidade == "itália") {
        document.write("Você é italiano");
    } else if (nacionalidade == "noruega") {
        document.write("Você é norueguês");
    } else {
        document.write("Você digitou algo errado");
    }
</script>
