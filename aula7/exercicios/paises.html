<script>
    let paises = ["Brasil", "Rússia", "Espanha", "Itália", "Noruega"];
    let escolha = parseInt(window.prompt("Escolha um número de 1 a 5 para ver um país:"));
    if (escolha == 1){
        document.write(`O país escolhido foi: ${paises[0]}`);
    } else if (escolha == 2){
        document.write(`O país escolhido foi: ${paises[1]}`);
    } else if (escolha == 3){
        document.write(`O país escolhido foi: ${paises[2]}`);
    } else if (escolha == 4){
        document.write(`O país escolhido foi: ${paises[3]}`);
    } else if (escolha == 5){
        document.write(`O país escolhido foi: ${paises[4]}`);
    } else {
        document.write("Número inválido. Por favor, escolha um número de 1 a 5.");
    }
</script>
