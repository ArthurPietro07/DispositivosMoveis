<script>
    let playlist = [];
    let musica;

    do {
        musica = prompt("Digite o nome da música que queira adicionar na playlist:");

        if (musica === null || musica.trim() === "") {
            alert("O nome da música não pode estar vazio");
            continue;
        }

        if (musica.toLowerCase() !== "fim") {
            playlist.push(musica);
        }

    } while (musica.toLowerCase() !== "fim");

    alert(`Você colocou ${playlist.length} músicas:\n\n${playlist.join("\n")}`);
</script>
