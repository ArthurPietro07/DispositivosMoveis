<script>
    let piloto = parseInt(window.prompt("Digite um número de 1 a 7 para ver o nome do piloto:"));

    switch (piloto) {
        case 1:
            document.write('O piloto 1 é o Kimi Antonelli')
            break
        case 2:
            document.write('O piloto 2 é o Oscar Piastri')
            break
        case 3:
            document.write('O piloto 3 é o Charles Leclerc')
            break
        case 4:
            document.write('O piloto 4 é o Max Verstapen')
            break
        case 5:
            document.write('O piloto 5 é o George Russel')
            break
        case 6:
            document.write('O piloto 6 é o Gabriel Bortoleto')
            break
        case 7:
            document.write('O piloto 7 é o Carlos Sainz')
            break
        default:
            document.write('Você digitou algo errado')
            break
    }
</script>
